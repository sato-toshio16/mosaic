<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
</head>
<body>
  <a-scene mindar-face embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
    vrmode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

  <!-- 自作コード -->
  <!-- 画像読み込み -->
  <a-assets>
    <img id="mosaic" src="./mosaic.png">
  </a-assets>
  <!-- カメラ -->
  <a-camera active="false" position="0 0 0"></a-camera>
  <!-- モザイク -->
  <a-entity mindar-face-target="anchorIndex: 168">
  <a-plane
    src="#mosaic"
    position="0 -0.08 0.2"
    width="1.15"
    height="1.25"
    material="shader: flat; transparent: true; side: double">
  </a-plane>
  </a-entity>
    
  </a-scene>
</body>
</html>
